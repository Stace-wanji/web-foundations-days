<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 2 – About</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Learning Site</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>About this site</h2>
      <p>This site is a weekly exercise in learning front-end development, one day at a time.</p>
    </section>

    <section>
      <h2>Feedback</h2>
      <form action="#" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com">

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" placeholder="Your feedback..."></textarea>

        <button type="submit">Send feedback</button>
      </form>
    </section>
  </main>

</body>
</html>
